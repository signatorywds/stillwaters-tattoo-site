<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Still Waters Fine Line Tattoo — botanical, fine line, script and micro tattoos by appointment in Peoria, Arizona." />
    <title>Still Waters Fine Line Tattoo</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Alex+Brush&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- If you add any scoped CSS files, uncomment the following to load them
    <link href="StillWatersTattoo.styles.css" rel="stylesheet" /> -->
    <!--
        No canonical tag here on purpose. Every route is served from this one file, so a
        hardcoded canonical would tell Google that /portfolio, /brows and /book are all
        really the homepage, and it would drop them from the index.
    -->
    <noscript>
        <!-- Without JS the app never boots, so drop the loading overlay and show the fallback instead. -->
        <style>
            .boot-screen { display: none; }
        </style>
    </noscript>
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="boot-screen">
            <span class="boot-mark">SW</span>
            <svg class="loading-progress">
                <circle r="40%" cx="50%" cy="50%" />
                <circle r="40%" cx="50%" cy="50%" />
            </svg>
            <div class="loading-progress-text"></div>
        </div>

        <!--
            Pre-boot content. Blazor replaces everything in #app once the runtime starts,
            so visitors never read this - but search crawlers and link previews do, and it
            is all anyone without JavaScript would get. Keep it true to the rendered site.
        -->
        <div id="seo-content"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="js/site.js"></script>
</body>

</html>
